<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKC VoIP - পেশাদার কলিং প্ল্যাটফর্ম</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- কনসোল লগ বক্স -->
    <div id="debugLogBox" style="background: #000; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; height: 100px; overflow-y: auto; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999;">
        > System Logs:<br>
    </div>

<div class="main-container">
    <div class="brand-header">
        <h1>📞 <span>RKC</span> VoIP</h1>
    </div>

    <!-- পেজ ১: লগইন ও রেজিস্ট্রেশন পেজ -->
    <div id="loginPage" class="page active">
        <div class="logo-area">
            <h2>স্বাগতম!</h2>
            <p>আপনার ফোন নম্বর এবং পাসওয়ার্ড দিয়ে লগইন বা রেজিস্ট্রেশন করুন</p>
        </div>

        <div class="input-group">
            <label>মোবাইল নম্বর</label>
            <input type="text" id="emailInput" class="input-box" placeholder="01712345678">
        </div>
        <div class="input-group">
            <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষরের)</label>
            <input type="password" id="passwordInput" class="input-box" placeholder="পাসওয়ার্ড দিন">
        </div>
        <button class="btn btn-primary" onclick="registerUser()">রেজিস্ট্রেশন করুন</button>
        <button class="btn btn-verify" onclick="loginUser()" style="margin-top: 5px;">লগইন করুন</button>
        <p id="authError" style="color: red; font-size: 12px; margin-top: 8px; text-align: center;"></p>
    </div>

    <!-- পেজ ২: ডায়ালপ্যাড ড্যাশবোর্ড পেজ -->
    <div id="dashboardPage" class="page">
        <div class="header">
            <div class="balance-container" style="cursor: default;" title="আপনার ভার্চুয়াল নম্বর">
                <div style="font-size: 13px; color: #2980b9; font-weight: bold; text-align: left;">নম্বর: <span id="myVirtualNumber">----</span></div>
            </div>
            <div class="menu-icon" onclick="toggleMenu(event)">☰</div>
        </div>

        <div id="settingsMenu" class="dropdown-menu">
            <div class="menu-user-info" id="menuUserEmail">ID: Loading...</div>
            <div class="menu-item" onclick="showPage('callHistoryPage'); closeMenu()">📞 কল হিস্ট্রি</div>
            <div class="menu-item" onclick="showPage('adminPage'); closeMenu()">🛡️ এডমিন প্যানেল</div>
            <div class="menu-item logout" onclick="logoutUser()">🚪 লগআউট</div>
        </div>

        <div class="screen-box">
            <input type="text" id="dialScreen" class="screen" placeholder="">
            <button class="backspace-btn-inside" onclick="deleteDigit()">⌫</button>
        </div>

        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn" onclick="pressKey('*')">*</button>
            <button class="key-btn zero-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn" onclick="pressKey('#')">#</button>
        </div>

        <div class="call-action-bar">
            <button class="action-side-btn" onclick="showPage('contactsPage')">📇</button>
            <button class="call-btn" onclick="makeCall()">📞</button>
            <button class="action-side-btn" onclick="clearScreen()">🗑️</button>
        </div>
    </div>

    <!-- পেজ ৩: কলিং স্ক্রিন -->
    <div id="callingPage" class="page">
        <div class="calling-screen">
            <p style="font-size: 20px; color: #27ae60; font-weight: bold; margin-bottom: 10px;">কল হচ্ছে...</p>
            <h2 id="callingNumberDisplay" style="color: #2c3e50; margin: 15px 0;">01795624217</h2>
            <div style="font-size: 30px; margin: 15px 0;">⏳</div>
            <button class="btn btn-danger" onclick="endCall()">কল কাটুন ❌</button>
        </div>
    </div>

    <!-- পেজ ৪: কন্টাক্টস পেজ -->
    <div id="contactsPage" class="page">
        <h2>📇 কন্টাক্ট লিস্ট</h2>
        <div class="input-group" style="margin-top: 10px;">
            <input type="text" id="contactName" class="input-box" placeholder="নাম লিখুন">
        </div>
        <div class="input-group">
            <input type="text" id="contactPhone" class="input-box" placeholder="নম্বর">
        </div>
        <button class="btn btn-primary" onclick="saveContact()">সেভ করুন</button>
        <button class="btn btn-secondary" onclick="showPage('dashboardPage')">ফিরে যান</button>
    </div>

    <!-- পেজ ৫: স্থায়ী কল হিস্ট্রি পেজ -->
    <div id="callHistoryPage" class="page">
        <h2>📞 কল হিস্ট্রি</h2>
        <div class="history-box" id="callHistoryList" style="margin-top: 15px;">
            <p style="text-align: center; color: #666; font-size: 13px;">লোড হচ্ছে...</p>
        </div>
        <button class="btn btn-primary" onclick="showPage('dashboardPage')">ফিরে যান</button>
    </div>

    <!-- পেজ ৬: এডমিন প্যানেল পেজ -->
    <div id="adminPage" class="page">
        <h2>🛡️ এডমিন প্যানেল</h2>
        <div class="history-box" id="adminRequestList" style="max-height: 280px;">
            <p style="text-align: center; color: #666; font-size: 13px;">লোড হচ্ছে...</p>
        </div>
        <button class="btn btn-primary" onclick="showPage('dashboardPage')">ফিরে যান</button>
    </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
